name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build, test, and audit Lean code
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: FemLean
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Run smoke tests
        run: lake env lean tests/Smoke.lean

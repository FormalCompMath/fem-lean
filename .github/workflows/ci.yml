name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Build, test, and audit Lean code
        uses: leanprover/lean-action@v1
        with:
          build: true
          test: false
          lint: false
          axiom-audit: true
          axiom-audit-root: FemLean
          axiom-audit-allow: propext,Classical.choice,Quot.sound

      - name: Run smoke tests
        run: lake env lean tests/Smoke.lean

      - name: Check the RFC 0001 representation prototype
        run: |
          lake build EllipticPdes.Poincare.GraphBounded
          lake env lean experiments/rfc0001/EllipticPDE.lean

      - name: Check the RFC 0002 mesh prototype
        run: |
          lake build Mathlib.Geometry.Euclidean.Incenter.Basic Mathlib.Analysis.InnerProductSpace.PiL2 \
            Mathlib.Tactic.FinCases Mathlib.Tactic.Linarith
          mkdir -p .lake/build/lib/lean/experiments/rfc0002
          lake env lean -o .lake/build/lib/lean/experiments/rfc0002/TriangleMesh.olean experiments/rfc0002/TriangleMesh.lean
          lake env lean experiments/rfc0002/UnitSquare.lean

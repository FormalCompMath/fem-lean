name: Compile blueprint

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  changes:
    name: Detect documentation changes
    runs-on: ubuntu-24.04
    outputs:
      lean: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.lean }}
      blueprint: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.blueprint }}
      homepage: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.homepage }}
      workflow: ${{ github.event_name == 'workflow_dispatch' && 'true' || steps.filter.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Classify changed files
        if: github.event_name != 'workflow_dispatch'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            lean:
              - 'FemLean/**'
              - 'FemLean.lean'
              - 'lakefile.toml'
              - 'lakefile.lean'
              - 'lake-manifest.json'
              - 'lean-toolchain'
              - 'docbuild/**'
            blueprint:
              - 'blueprint/**'
            homepage:
              - 'home_page/**'
            workflow:
              - '.github/workflows/blueprint.yml'

  build_project:
    needs: changes
    if: >-
      needs.changes.outputs.lean == 'true' ||
      needs.changes.outputs.blueprint == 'true' ||
      needs.changes.outputs.homepage == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    name: Build project
    steps:
      - name: Cleanup to free disk space
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.lean == 'true' ||
          needs.changes.outputs.blueprint == 'true' ||
          needs.changes.outputs.workflow == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Build and lint project
        if: >-
          github.event_name != 'pull_request' ||
          needs.changes.outputs.lean == 'true' ||
          needs.changes.outputs.blueprint == 'true' ||
          needs.changes.outputs.workflow == 'true'
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: true

      - name: Compile blueprint and documentation
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: ${{ github.event_name != 'pull_request' || needs.changes.outputs.lean == 'true' || needs.changes.outputs.blueprint == 'true' || needs.changes.outputs.workflow == 'true' }}
          homepage: home_page
          deploy: false

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: home_page/_site

  deploy:
    if: github.event_name == 'push'
    needs: build_project
    name: Deploy Pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

name: Compile blueprint

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 02:23 Beijing time; refresh the complete API documentation nightly.
    - cron: '23 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    name: Detect documentation changes
    runs-on: ubuntu-24.04
    outputs:
      lean: ${{ steps.filter.outputs.lean }}
      api: ${{ steps.filter.outputs.api }}
      blueprint: ${{ steps.filter.outputs.blueprint }}
      homepage: ${{ steps.filter.outputs.homepage }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Classify changed files
        if: github.event_name == 'push' || github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            lean:
              - 'FemLean/**'
              - 'FemLean.lean'
              - 'lakefile.toml'
              - 'lakefile.lean'
              - 'lake-manifest.json'
              - 'lean-toolchain'
              - 'docbuild/**'
            api:
              - 'lakefile.toml'
              - 'lakefile.lean'
              - 'lake-manifest.json'
              - 'lean-toolchain'
              - 'docbuild/**'
            blueprint:
              - 'blueprint/**'
            homepage:
              - 'home_page/**'
            workflow:
              - '.github/workflows/blueprint.yml'

  build_project:
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      needs.changes.outputs.lean == 'true' ||
      needs.changes.outputs.blueprint == 'true' ||
      needs.changes.outputs.homepage == 'true' ||
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-24.04
    name: Build project
    steps:
      - name: Checkout project
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: Restore the previous generated site components
        if: github.ref == 'refs/heads/main'
        id: site-cache
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .site-components
          key: femlean-site-v2-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: femlean-site-v2-

      - name: Select the build mode
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          LEAN_CHANGE: ${{ needs.changes.outputs.lean }}
          API_CHANGE: ${{ needs.changes.outputs.api }}
          BLUEPRINT_CHANGE: ${{ needs.changes.outputs.blueprint }}
          WORKFLOW_CHANGE: ${{ needs.changes.outputs.workflow }}
        run: |
          blueprint=true
          api=true
          case "$EVENT_NAME" in
            pull_request)
              if [[ "$API_CHANGE" != true && "$WORKFLOW_CHANGE" != true ]]; then
                api=false
                if [[ "$LEAN_CHANGE" != true && "$BLUEPRINT_CHANGE" != true ]]; then
                  blueprint=false
                fi
              fi
              ;;
            push)
              # A cancelled push can leave the cached site several commits behind.
              if [[ -s .site-components/docs/index.html && -s .site-components/blueprint/index.html &&
                    -s .site-components/blueprint.pdf && -s .site-components/revision ]]; then
                revision=$(<.site-components/revision)
                if [[ "$revision" =~ ^[0-9a-f]{40}$ ]] && git merge-base --is-ancestor "$revision" HEAD &&
                   git diff --quiet "$revision" HEAD -- lakefile.toml lakefile.lean lake-manifest.json \
                     lean-toolchain docbuild .github/workflows/blueprint.yml; then
                  api=false
                  if git diff --quiet "$revision" HEAD -- FemLean FemLean.lean blueprint; then
                    blueprint=false
                  fi
                fi
              fi
              ;;
          esac
          echo "blueprint=$blueprint" >> "$GITHUB_OUTPUT"
          echo "api=$api" >> "$GITHUB_OUTPUT"
          echo "Build blueprint: $blueprint; build API: $api" >> "$GITHUB_STEP_SUMMARY"

      - name: Cleanup to free disk space
        if: steps.mode.outputs.blueprint == 'true'
        uses: jlumbroso/free-disk-space@54081f138730dfa15788a46383842cd2f914a1be # v1.3.0
        with:
          tool-cache: false
          android: true
          dotnet: false
          haskell: false
          large-packages: false
          docker-images: false
          swap-storage: false

      - name: Build and lint project
        if: steps.mode.outputs.blueprint == 'true'
        uses: leanprover/lean-action@434f25c2f80ded67bba02502ad3a86f25db50709 # 2025-07-02
        with:
          build: true
          lint: false
          mk_all-check: true

      # The TeX container writes as root. Keep its output directory runner-owned
      # so the following step can move the generated files without sudo.
      - name: Prepare blueprint output directory
        if: steps.mode.outputs.blueprint == 'true'
        run: mkdir .generated-blueprint

      - name: Compile blueprint and check its Lean declarations
        if: steps.mode.outputs.blueprint == 'true'
        uses: leanprover-community/docgen-action@deed0cdc44dd8e5de07a300773eb751d33e32fc8 # 2025-10-26
        with:
          blueprint: true
          api-docs: false
          build-page: false
          homepage: .generated-blueprint
          deploy: false

      - name: Generate the API with the locked docbuild project
        if: steps.mode.outputs.api == 'true'
        working-directory: docbuild
        run: lake build FemLean:docs

      - name: Install homepage dependencies
        uses: ruby/setup-ruby@eaecf785f6a34567a6d97f686bbb7bccc1ac1e5c # v1.237.0
        with:
          working-directory: home_page
          ruby-version: '3.1'
          bundler-cache: true

      - name: Build the homepage
        working-directory: home_page
        env:
          JEKYLL_ENV: production
          JEKYLL_GITHUB_TOKEN: ${{ github.token }}
        run: |
          bundle exec jekyll build
          test -s _site/index.html
          test -s _site/zh-CN/index.html

      - name: Replace rebuilt components and verify entry points
        env:
          BLUEPRINT: ${{ steps.mode.outputs.blueprint }}
          API: ${{ steps.mode.outputs.api }}
          PUBLISH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          mkdir -p .site-components
          if [[ "$BLUEPRINT" == true ]]; then
            test -s .generated-blueprint/blueprint/index.html
            test -s .generated-blueprint/blueprint.pdf
            rm -rf .site-components/blueprint
            mv -T .generated-blueprint/blueprint .site-components/blueprint
            mv -f .generated-blueprint/blueprint.pdf .site-components/blueprint.pdf
          fi
          if [[ "$API" == true ]]; then
            test -s docbuild/.lake/build/doc/index.html
            rm -rf .site-components/docs
            mv -T docbuild/.lake/build/doc .site-components/docs
          fi
          if [[ "$PUBLISH" == true ]]; then
            test -s .site-components/docs/index.html
            test -s .site-components/blueprint/index.html
            test -s .site-components/blueprint.pdf
            git rev-parse HEAD > .site-components/revision
          fi

      - name: Save the complete generated site components
        if: success() && github.ref == 'refs/heads/main'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .site-components
          key: femlean-site-v2-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Assemble the Pages site
        if: github.ref == 'refs/heads/main'
        run: |
          mv -T .site-components/blueprint home_page/_site/blueprint
          mv -T .site-components/docs home_page/_site/docs
          mv .site-components/blueprint.pdf home_page/_site/

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: home_page/_site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build_project
    name: Deploy Pages
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

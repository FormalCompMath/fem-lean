name = "fem-lean"
version = "0.1.0"
keywords = ["math", "finite elements", "formalization"]
defaultTargets = ["FemLean"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "master"

[[require]]
name = "EllipticPdes"
git = "https://github.com/alejandro-soto-franco/EllipticPDE.git"
rev = "d25bc25df4289edc13cb4fa6b79a7d88cbe5b12b"
subDir = "lean"

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[lean_lib]]
name = "FemLean"

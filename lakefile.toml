name = "fem-lean"
version = "0.1.0"
keywords = ["math", "finite elements", "formalization"]
defaultTargets = ["FemLean"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.36.0"

[[require]]
name = "checkdecls"
git = "https://github.com/PatrickMassot/checkdecls.git"
rev = "master"

[[lean_lib]]
name = "FemLean"
